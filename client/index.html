<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerPilot - AI Career Companion</title>
    <meta name="description" content="CareerPilot AI is an AI-powered career companion helping students and professionals with learning plans, resume building, portfolio projects, and AI mock interviews." />
    <meta name="keywords" content="CareerPilot AI, AI career companion, AI career guidance, AI learning plan generator, AI resume builder, portfolio builder, AI mock interview" />
    <meta name="theme-color" content="#0f172a" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        background: #f5f4f2;
        color: #18181b;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #f5f4f2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-loader.hidden {
        opacity: 0 !important;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-logo {
        font-size: 1.875rem;
        font-weight: 800;
        color: #18181b;
        margin-bottom: 2rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        letter-spacing: -0.02em;
      }
      .loader-logo-icon {
        width: 44px;
        height: 44px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
      }
      .loader-icons {
        display: flex;
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      .loader-icon {
        width: 42px;
        height: 42px;
        color: #a1a1aa;
        animation: iconPulse 1.5s ease-in-out infinite;
        opacity: 0.5;
      }
      .loader-icon:nth-child(1) { animation-delay: 0s; }
      .loader-icon:nth-child(2) { animation-delay: 0.15s; }
      .loader-icon:nth-child(3) { animation-delay: 0.3s; }
      .loader-icon:nth-child(4) { animation-delay: 0.45s; }
      .loader-icon:nth-child(5) { animation-delay: 0.6s; }

      @keyframes iconPulse {
        0%, 100% { opacity: 0.3; transform: scale(1); color: #a1a1aa; }
        50% { opacity: 1; transform: scale(1.15); color: #2563eb; }
      }
      .loader-text {
        color: #52525b;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      .loader-dots {
        display: inline-flex;
        gap: 4px;
        margin-left: 4px;
      }
      .loader-dots span {
        width: 4px;
        height: 4px;
        background: #18181b;
        border-radius: 50%;
        animation: dotBounce 1.2s ease-in-out infinite;
      }
      .loader-dots span:nth-child(1) { animation-delay: 0s; }
      .loader-dots span:nth-child(2) { animation-delay: 0.15s; }
      .loader-dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes dotBounce {
        0%, 100% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
  </head>
  <body class="bg-[#f5f4f2] text-zinc-900 antialiased">
    <!-- CareerPilot App Loader -->
    <div id="app-loader">
      <div class="loader-logo">
        <div class="loader-logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        </div>
        CareerPilot AI
      </div>
      <div class="loader-icons">
        <svg class="loader-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
        <svg class="loader-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <svg class="loader-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <svg class="loader-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        <svg class="loader-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="loader-text">
        Loading your career companion
        <span class="loader-dots">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('app-loader');
        if (loader) {
          setTimeout(() => {
            loader.classList.add('hidden');
          }, 400);
        }
      });
    </script>
  </body>
</html>
