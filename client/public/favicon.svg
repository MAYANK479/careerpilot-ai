<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Background subtle glow circle -->
  <circle cx="64" cy="64" r="38" fill="#3B82F6" opacity="0.15" filter="url(#glow)" />

  <!-- Compass Ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.4" />
  <circle cx="64" cy="64" r="34" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.3" />

  <!-- Compass Needle / Modern Pilot Arrow (North & South) -->
  <!-- North Needle (White to Cyan) -->
  <polygon points="64,24 74,60 64,55 54,60" fill="url(#accentGrad)" filter="url(#glow)" />
  
  <!-- South Needle (Deep Royal Blue) -->
  <polygon points="64,104 74,68 64,73 54,68" fill="url(#needleGrad)" />

  <!-- East/West Wings -->
  <polygon points="104,64 68,54 73,64 68,74" fill="url(#needleGrad)" opacity="0.85" />
  <polygon points="24,64 60,54 55,64 60,74" fill="url(#needleGrad)" opacity="0.85" />

  <!-- Center Core Ring & Dot -->
  <circle cx="64" cy="64" r="7" fill="#0F172A" stroke="#60A5FA" stroke-width="2.5" />
  <circle cx="64" cy="64" r="3" fill="#FFFFFF" />

  <!-- AI Sparkle in Top Right -->
  <path d="M96 22 Q96 30 104 30 Q96 30 96 38 Q96 30 88 30 Q96 30 96 22 Z" fill="#38BDF8" filter="url(#glow)" />
</svg>